<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .ring {
        position: absolute;
        left: -36px;
        bottom: -36px;
        width: 72px;
        height: 72px;
        opacity: 0;
        border-radius: 50%;
        border: 10px solid #cfd8e3;
        pointer-events: none;
      }
      .item:hover .ring {
        opacity: 0.32;
        transition: all 0.6s ease;
      }
    </style>
  </head>
  <body>
    <span class="ring" aria-hidden="true"></span>
  </body>
</html>
