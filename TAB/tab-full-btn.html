<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      /* Layout */
      .tab-full-btn-wrapper {
        display: flex;
        gap: 28px;
      }

      /* Sidebar */
      .tab-full-btn-sidebar {
        width: 260px;
        flex-shrink: 0;
        padding: 8px;
        background: #fff;
      }
      .tab-full-btn-sidebar-title {
        font-size: 16px;
        padding-left: 22px;
        letter-spacing: 0.14em;
        color: #000;
        margin-bottom: 14px;
        font-weight: 500;
      }

      .tab-full-btn-btn {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 4px;
        margin-bottom: 6px;
        cursor: pointer;
        color: #012060;
        font-size: 16px;
        transition: 0.3s;
      }
      .tab-full-btn-btn:hover {
        background: #cfd4df;
        color: #012060;
      }
      input {
        display: none;
      }

      /* ACTIVE */
      #tab1:checked ~ .tab-full-btn-wrapper .btn1,
      #tab2:checked ~ .tab-full-btn-wrapper .btn2,
      #tab3:checked ~ .tab-full-btn-wrapper .btn3,
      #tab4:checked ~ .tab-full-btn-wrapper .btn4,
      #tab5:checked ~ .tab-full-btn-wrapper .btn5,
      #tab6:checked ~ .tab-full-btn-wrapper .btn6,
      #tab7:checked ~ .tab-full-btn-wrapper .btn7,
      #tab8:checked ~ .tab-full-btn-wrapper .btn8,
      #tab9:checked ~ .tab-full-btn-wrapper .btn9,
      #tab10:checked ~ .tab-full-btn-wrapper .btn10,
      #tab11:checked ~ .tab-full-btn-wrapper .btn11 {
        background: #012060;
        border-color: #012060;
        font-weight: 700;
        color: #fff;
        font-size: 16px;
      }

      /* Tabs */
      .tab-full-btn-content {
        flex: 1;
      }
      .tab-full-btn-tab {
        display: none;
      }

      #tab1:checked ~ .tab-full-btn-wrapper #c1,
      #tab2:checked ~ .tab-full-btn-wrapper #c2,
      #tab3:checked ~ .tab-full-btn-wrapper #c3,
      #tab4:checked ~ .tab-full-btn-wrapper #c4,
      #tab5:checked ~ .tab-full-btn-wrapper #c5,
      #tab6:checked ~ .tab-full-btn-wrapper #c6,
      #tab7:checked ~ .tab-full-btn-wrapper #c7,
      #tab8:checked ~ .tab-full-btn-wrapper #c8,
      #tab9:checked ~ .tab-full-btn-wrapper #c9,
      #tab10:checked ~ .tab-full-btn-wrapper #c10,
      #tab11:checked ~ .tab-full-btn-wrapper #c11 {
        display: block;
      }

      /* Hero */
      .tab-full-btn-hero {
        position: relative;
        border-radius: 13px;
        overflow: hidden;
        margin-bottom: 36px;
      }
      .tab-full-btn-hero img {
        width: 100%;
        object-fit: cover;
        display: block;
      }
      .tab-full-btn-hero-title {
        color: #012060;
        font-size: 24px;
        font-weight: 700;
        margin: 14px 0 20px;
      }

      /* Card */
      .tab-full-btn-card {
        background: #fff;
        border-radius: 13px;
        padding: 26px;
        margin-bottom: 36px;
      }
      .tab-full-btn-label {
        display: inline-block;
        font-size: 16px;
        font-weight: 700;
        padding: 6px 14px;
        border-top-right-radius: 999px;
        border-bottom-right-radius: 999px;
        border-bottom-left-radius: 999px;
        margin-bottom: 12px;
        color: #012060;
      }
      .tab-full-btn-title {
        font-size: 22px;
        font-weight: 700;
        color: #012060;
        margin-bottom: 12px;
      }
      .tab-full-btn-body {
        font-size: 16px;
        font-weight: 500;
        margin-top: 22px;
        line-height: 1.75;
        color: #000;
      }
      .tab-full-btn-divider {
        display: none;
      }
      .tab-full-btn-body ul {
        margin: 0;
        list-style: none;
        padding: 0;
      }
      .tab-full-btn-body li {
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tab-full-btn-body li svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: #fff;
      }

      /* ===== Item dokumen (dirender dari object JS) ===== */
      .tab-full-btn-doc-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .tab-full-btn-doc-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid #e6e9f0;
      }
      .tab-full-btn-doc-item:last-child {
        border-bottom: none;
      }
      .tab-full-btn-doc-name {
        color: #000;
        font-size: 16px;
        line-height: 1.5;
      }
      .tab-full-btn-doc-name .tab-full-btn-doc-no {
        color: #012060;
        font-weight: 700;
        margin-right: 6px;
      }
      .cta-sakip.is-disabled {
        background-color: #cfd4df;
        border-color: #cfd4df;
        color: #6b7280;
        cursor: not-allowed;
        pointer-events: none;
      }

      /* Warna badge per jenis section (urutan tetap: Tentang, Arah & Tujuan, Komitmen, Masa Depan) */
      /* .tab-full-btn-tab > .tab-full-btn-card:nth-of-type(2) .tab-full-btn-label {
        background: #ffe3cf;
        border: 1px solid #eab48a;
      }
      .tab-full-btn-tab > .tab-full-btn-card:nth-of-type(3) .tab-full-btn-label {
        background: #d2edbd;
        border: 1px solid #bcff88;
      }
      .tab-full-btn-tab > .tab-full-btn-card:nth-of-type(4) .tab-full-btn-label {
        background: #f5e9cc;
        border: 1px solid #e8d19a;
      }
      .tab-full-btn-tab > .tab-full-btn-card:nth-of-type(5) {
        border-left: 4px solid #1168db;
      }
      .tab-full-btn-tab > .tab-full-btn-card:nth-of-type(5) .tab-full-btn-label {
        background: #bee1f5;
        border: 1px solid #74cdff;
      } */

      /* CTA */
      .tab-full-btn-cta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        border-left: 4px solid #1168db;
      }
      .tab-full-btn-cta strong {
        color: #012060;
      }
      .tab-full-btn-btn-more {
        display: inline-flex;
        align-items: center;
        background: #012060;
        padding: 12px 24px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        font-size: 16px;
        color: #fff;
        white-space: nowrap;
        transition: all 0.3s ease;
      }
      .tab-full-btn-btn-more:hover {
        background: #1168db;
      }
      .icon-dibagian-sidebar-link {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }
      .y-badge {
        display: inline-block;
        font-size: 16px;
        font-weight: 700;
        text-transform: capitalize;
        padding: 8px 12px;
        border-radius: 999px;
        white-space: nowrap;
        color: #012060;
      }

      .y-badge-green {
        background: #d3edbc;
        border: 1px solid #94ad7e;
      }
      .y-badge-red {
        background: #ffd0ca;
        border: 1px solid #ff9f93;
      }
      .y-badge-orange {
        background: #ffc8aa;
        border: 1px solid #e6b296;
      }
      .y-badge-purple {
        background: #e7cff3;
        border: 1px solid #a79aad;
      }
      .y-badge-yellow {
        background: #fee69d;
        border: 1px solid #b09e6a;
      }

      .y-badge-blue {
        background: #bee1f4;
        border: 1px solid #8fa6b3;
      }

      .y-badge-pink {
        background: #ffdbe9;
        border: 1px solid #f0a8c4;
      }

      .card-bawah-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0;
        border-radius: 18px;
        /* padding: 26px; */
        background-color: #fff;
        min-height: 110px;
      }

      .cta-sakip {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        background-color: #012060;
        font-size: 16px;
        font-weight: 600;
        border: 1px solid #012060;
        padding: 12px 20px;
        margin-left: 26px;
        border-radius: 4px;
        cursor: pointer;
        position: relative;
        text-decoration: none;
        white-space: nowrap;
        transition:
          opacity 0.2s ease,
          transform 0.15s ease;
      }
      .cta-sakip:hover {
        background-color: #cfd4df;
        color: #012060;
        border: none;
        border: 1px solid #cfd4df;
        transition: all 0.3s ease;
      }
      .cta-sakip svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .cta-sakip:hover svg {
        color: #012060;
      }

      /* ===== Responsive: tablet (sidebar tetap di samping, tapi lebih ringkas) ===== */
      @media (max-width: 992px) {
        .tab-full-btn-wrapper {
          gap: 18px;
        }
        .tab-full-btn-sidebar {
          width: 210px;
        }
        .tab-full-btn-hero-title {
          font-size: 21px;
        }
        .tab-full-btn-card {
          padding: 20px;
        }
      }

      /* ===== Responsive: sidebar pindah ke atas saat layar HP ===== */
      @media (max-width: 768px) {
        .tab-full-btn-wrapper {
          flex-direction: column;
          gap: 20px;
        }

        .tab-full-btn-sidebar {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }

        .tab-full-btn-sidebar-title {
          flex-basis: 100%;
          padding-left: 4px;
          margin-bottom: 6px;
        }

        .tab-full-btn-btn {
          margin-bottom: 0;
          padding: 8px 14px;
          font-size: 14px;
          flex: 1 1 calc(50% - 8px);
          justify-content: center;
          white-space: nowrap;
        }

        .icon-dibagian-sidebar-link {
          width: 18px;
          height: 18px;
        }

        .tab-full-btn-card {
          padding: 18px;
        }

        .tab-full-btn-hero-title {
          font-size: 18px;
        }

        .tab-full-btn-title {
          font-size: 19px;
        }

        .tab-full-btn-label,
        .tab-full-btn-body {
          font-size: 15px;
        }

        /* Item dokumen: nama dan tombol ditumpuk supaya judul panjang
           tidak berdesakan dengan tombol "Buka Dokumen" */
        .tab-full-btn-doc-item {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .tab-full-btn-doc-name {
          font-size: 15px;
        }

        .cta-sakip {
          margin-left: 0;
          width: 100%;
          justify-content: center;
        }
      }

      /* Layar sangat kecil: jadikan daftar fakultas scroll horizontal
         supaya tidak terlalu banyak baris yang wrap */
      @media (max-width: 480px) {
        .tab-full-btn-sidebar {
          flex-wrap: nowrap;
          overflow-x: auto;
          -webkit-overflow-scrolling: touch;
          padding-bottom: 6px;
        }

        .tab-full-btn-sidebar-title {
          flex-basis: auto;
          width: 100%;
        }

        .tab-full-btn-btn {
          flex: 0 0 auto;
          white-space: nowrap;
        }

        .tab-full-btn-card {
          padding: 14px;
        }

        .tab-full-btn-title {
          font-size: 17px;
        }
      }
    </style>
  </head>

      // =========================================================
      // RENDERER: mengubah object/array data di atas menjadi
      // kartu (.tab-full-btn-card) berisi daftar dokumen + tombol yang
      // meredirect ke link (Drive / um.ac.id) saat diklik.
      // =========================================================

      function buildDocButton(url) {
        const a = document.createElement("a");
        a.className = "cta-sakip";
        a.textContent = "Buka Dokumen";

        const icon = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg",
        );
        icon.setAttribute("width", "16");
        icon.setAttribute("height", "16");
        const use = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "use",
        );
        use.setAttribute("href", "#icon-arrow");
        icon.appendChild(use);
        a.appendChild(icon);

        if (url) {
          a.href = url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
        } else {
          a.classList.add("is-disabled");
          a.setAttribute("aria-disabled", "true");
          a.title = "Tautan belum tersedia";
        }
        return a;
      }

      function buildDocItem(no, name, url) {
        const li = document.createElement("li");
        li.className = "tab-full-btn-doc-item";

        const nameEl = document.createElement("span");
        nameEl.className = "tab-full-btn-doc-name";
        if (no !== "" && no !== undefined && no !== null) {
          const noEl = document.createElement("span");
          noEl.className = "tab-full-btn-doc-no";
          noEl.textContent = `${no}.`;
          nameEl.appendChild(noEl);
        }
        nameEl.appendChild(document.createTextNode(name));

        li.appendChild(nameEl);
        li.appendChild(buildDocButton(url));
        return li;
      }

      // Render kelompok dokumen berbentuk { title, rows: [no, nama, url] }
      function renderDocGroups(containerEl, groups) {
        containerEl.innerHTML = "";
        groups.forEach((group) => {
          const card = document.createElement("div");
          card.className = "tab-full-btn-card";

          const title = document.createElement("div");
          title.className = "tab-full-btn-title";
          title.textContent = group.title;
          card.appendChild(title);

          const body = document.createElement("div");
          body.className = "tab-full-btn-body";
          const ul = document.createElement("ul");
          ul.className = "tab-full-btn-doc-list";

          group.rows.forEach(([no, name, url]) => {
            ul.appendChild(buildDocItem(no, name, url));
          });

          body.appendChild(ul);
          card.appendChild(body);
          containerEl.appendChild(card);
        });
      }

      // Render daftar tahun+link sederhana, mis. lakinDocs: [tahun, url]
      function renderYearDocs(containerEl, cardTitle, docs) {
        containerEl.innerHTML = "";
        const card = document.createElement("div");
        card.className = "tab-full-btn-card";

        const title = document.createElement("div");
        title.className = "tab-full-btn-title";
        title.textContent = cardTitle;
        card.appendChild(title);

        const body = document.createElement("div");
        body.className = "tab-full-btn-body";
        const ul = document.createElement("ul");
        ul.className = "tab-full-btn-doc-list";

        docs.forEach(([label, url]) => {
          ul.appendChild(buildDocItem("", label, url));
        });

        body.appendChild(ul);
        card.appendChild(body);
        containerEl.appendChild(card);
      }

      // ---- Eksekusi render per tab ----
      renderDocGroups(document.getElementById("c1"), sakipGroups);
      renderDocGroups(document.getElementById("c2"), pkGroups);

      // renstrabisTitles hanya berisi judul (belum ada URL Drive),
      // jadi tombolnya tampil disabled sampai linknya dilengkapi.
      renderYearDocs(document.getElementById("c3"),"Laporan Reintrabis", renstrabisDocs);

      renderYearDocs(
        document.getElementById("c4"),
        "Laporan Kinerja (LAKIN) UM per Tahun",
        lakinDocs,
      );
    </script>
  </body>
