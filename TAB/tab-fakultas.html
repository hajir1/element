<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      img {
        max-width: 100%;
        height: auto;
      }

      /* ============================================================
       LAYOUT DASAR (disamakan dengan desain "tentang_unit")
       ============================================================ */
      .fak-wrapper,
      .fak-wrapper * {
        box-sizing: border-box;
      }
      .fak-wrapper {
        --fak-sticky-top: 24px;

        display: flex;
        gap: 28px;
        margin: 0 auto;
        max-width: 100%;
        overflow-x: hidden;
        overflow-x: clip;
        font-family: "Albert Sans", Helvetica, Arial, Lucida, sans-serif;
      }

      /* ===== Sidebar (daftar fakultas) ===== */
      .fak-sidebar {
        width: 260px;
        flex-shrink: 0;
        align-self: flex-start;
        position: sticky;
        top: var(--fak-sticky-top);
        max-height: calc(100vh - var(--fak-sticky-top) - 16px);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }
      .fak-sidebar-title {
        font-size: 14px;
        padding-left: 22px;
        letter-spacing: 0.14em;
        color: #667;
        margin-bottom: 14px;
        font-weight: 600;
        text-transform: uppercase;
      }

      /* Tombol dropdown khusus HP (disembunyikan di desktop) */
      .tab-content-toggle {
        display: none;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border: 0;
        border-radius: 13px;
        background: #eef1f7;
        color: #012060;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.3;
        text-align: left;
        cursor: pointer;
        transition: 0.3s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .tab-content-toggle:hover {
        background: rgba(1, 32, 96, 0.08);
      }
      .tab-content-toggle.open {
        background: #012060;
        color: #fff;
      }
      .tab-content-toggle-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-content-toggle-icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .tab-content-chevron {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        transition: transform 0.3s ease;
      }
      .tab-content-toggle.open .tab-content-chevron {
        transform: rotate(180deg);
      }

      /* Daftar fakultas: selalu tampil di desktop, jadi dropdown di HP */
      .fak-list {
        display: grid;
        grid-template-rows: 1fr;
        transition: grid-template-rows 0.3s ease;
      }
      .fak-list-inner {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: hidden;
      }

      .fak-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 8px 12px;
        border: 0;
        border-radius: 13px;
        margin-bottom: 6px;
        /* display: flex; */
        background: transparent;
        cursor: pointer;
        color: #012060;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.3;
        text-align: left;
        transition: 0.3s;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .fak-btn:hover {
        background: #cfd4df;
        color: #012060;
      }
      .fak-btn.active {
        background: #012060;
        font-weight: 700;
        color: #fff;
      }
      .fak-btn:focus-visible {
        outline: 3px solid #0242c6;
        outline-offset: -3px;
      }
      .icon-dibagian-sidebar-link {
        width: 28px;
        height: 28px;
      }
      .fak-btn.active .icon-dibagian-sidebar-link {
        color: #fff;
      }
      

      /* ===== Konten ===== */
      .fak-content {
        flex: 1;
        min-width: 0;
      }
      .fak-tab {
        display: none;
      }
      .fak-tab.active {
        display: block;
      }
      .fak-card {
        background: #fff;
        border-radius: 13px;
        padding: 26px;
        margin-bottom: 36px;
      }

      /* ============================================================
       HEADER HALAMAN (nama fakultas), gaya sama seperti tentang_unit
       ============================================================ */
      .fak-page-header {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding-right: 12px;
        background: linear-gradient(135deg, #0242c6 0%, #012060 100%);
        border: 1px solid white;
        border-radius: 4px;
        color: #ffffff;
        position: relative;
        left: 50%;
        margin-bottom: 30px;
        transform: translateX(-50%);
        font-size: 28px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        max-width: 100%;
      }
      .fak-page-header-icon {
        background-color: #012060;
        padding: 12px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .fak-page-header-icon svg {
        width: 22px;
        height: 22px;
        fill: #fff;
      }
      .fak-page-header-text {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Hero */
      .fak-hero {
        position: relative;
        border-radius: 13px;
        overflow: hidden;
        margin-bottom: 36px;
      }
      .fak-hero img {
        width: 100%;
        object-fit: cover;
        display: block;
      }

      /* Label / badge tiap bagian kartu */
      .fak-label {
        display: inline-block;
        font-size: 14px;
        font-weight: 700;
        padding: 6px 14px;
        border-top-right-radius: 999px;
        border-bottom-right-radius: 999px;
        border-bottom-left-radius: 999px;
        margin-bottom: 12px;
        color: #012060;
      }
      .fak-title {
        font-size: 20px;
        font-weight: 700;
        color: #012060;
        margin-bottom: 12px;
      }
      .fak-body {
        font-size: 16px;
        font-weight: 500;
        margin-top: 22px;
        line-height: 1.75;
        color: #2b3346;
        text-align: justify;
      }
      .fak-body ul {
        margin: 0;
        list-style: none;
        padding: 0;
      }
      .fak-body li {
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .fak-body li svg {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        color: #0242c6;
      }

      .y-badge-green {
        background: #d3edbc;
        border: 1px solid #94ad7e;
      }
      .y-badge-purple {
        background: #e7cff3;
        border: 1px solid #a79aad;
      }
      .y-badge-yellow {
        background: #fee69d;
        border: 1px solid #b09e6a;
      }
      .y-badge-blue {
        background: #bee1f4;
        border: 1px solid #8fa6b3;
      }

      /* ===== Kartu CTA bawah ===== */
      .card-bawah-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0;
        border-radius: 13px;
        background-color: #fff;
        min-height: 110px;
      }
      .card-bawah-teks {
        flex: 1;
        padding-right: 40px;
        position: relative;
        z-index: 2;
      }
      .card-bawah-teks h3 {
        margin: 0 0 8px;
        color: #012060;
        font-size: 22px;
        padding-left: 26px;
        font-weight: 700;
        line-height: 1.35;
      }
      .card-bawah-teks p {
        padding-left: 26px;
        margin: 0 0 8px;
        color: #2b3346;
        font-size: 16px;
        line-height: 1.55;
      }
      .card-bawah-gambar {
        position: relative;
        flex: 0 0 260px;
        max-width: 260px;
        border-radius: 10px;
        overflow: hidden;
      }
      .card-bawah-gambar-placeholder img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }
      .card-bawah-gambar::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: linear-gradient(
          90deg,
          #ffffff 0%,
          rgba(255, 255, 255, 0.85) 15%,
          rgba(255, 255, 255, 0) 45%
        );
      }
      @media (max-width: 700px) {
        .card-bawah-item {
          flex-direction: column;
          align-items: flex-start;
        }
        .card-bawah-teks {
          padding-right: 0;
          margin-bottom: 14px;
        }
        .card-bawah-gambar {
          flex: 0 0 auto;
          width: 100%;
          max-width: 100%;
          height: 160px;
        }
        .card-bawah-gambar::before {
          background: linear-gradient(
            180deg,
            #ffffff 0%,
            rgba(255, 255, 255, 0.85) 15%,
            rgba(255, 255, 255, 0) 45%
          );
        }
      }
      .cta-fakultas {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: #fff;
        background-color: #012060;
        font-size: 15px;
        font-weight: 700;
        border: 1px solid #012060;
        padding: 13px 26px;
        margin-left: 26px;
        border-radius: 13px;
        cursor: pointer;
        position: relative;
        text-decoration: none;
        white-space: nowrap;
        transition: 0.25s;
      }
      .cta-fakultas:hover {
        background-color: #0242c6;
      }
      .cta-fakultas svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        margin-left: auto;
      }

      /* ============================================================
       RESPONSIVE — TABLET (≤ 1024px)
       ============================================================ */
      @media (max-width: 1024px) and (min-width: 769px) {
        .fak-sidebar {
          width: 210px;
        }
        .fak-page-header {
          display: none;
        }
      }

      /* ============================================================
       RESPONSIVE — MOBILE (≤ 768px): sidebar jadi dropdown, sama
       seperti submenu di tentang_unit — daftar vertikal yang bisa
       dibuka/tutup, bukan scroll horizontal.
       ============================================================ */
      @media (max-width: 768px) {
        .fak-wrapper {
          flex-direction: column;
          gap: 14px;
        }
        .fak-sidebar-title {
          display: none;
        }
        .fak-sidebar {
          width: 100%;
          align-self: stretch;
          position: sticky;
          top: 8px;
          z-index: 5;
          max-height: none;
          overflow: visible;
        }
        .tab-content-toggle {
          display: flex;
        }

        .fak-list {
          display: grid;
          grid-template-rows: 0fr;
        }
        .fak-list.open {
          grid-template-rows: 1fr;
        }
        .fak-list-inner {
          min-height: 0;
          visibility: hidden;
          transition: visibility 0s linear 0.3s;
          margin-top: 6px;
          padding: 8px;
          background: #fff;
          border-radius: 13px;
          box-shadow: 0 10px 24px rgba(1, 32, 96, 0.14);
          max-height: min(60vh, 420px);
          overflow-y: auto;
          -webkit-overflow-scrolling: touch;
          overscroll-behavior: contain;
        }
        .fak-list.open .fak-list-inner {
          visibility: visible;
          transition-delay: 0s;
        }

        .fak-btn {
          padding: 10px 12px;
          border-radius: 10px;
          font-size: 15px;
        }

        .fak-card {
          padding: 16px 14px;
          border-radius: 13px;
          margin-bottom: 20px;
        }

        .fak-page-header {
          display: none;
        }

        .fak-body {
          margin-top: 18px;
          font-size: 15px;
        }
        .fak-title {
          font-size: 18px;
        }
      }

      @media (max-width: 380px) {
        .tab-content-toggle {
          font-size: 13px;
        }
        .fak-btn {
          font-size: 14px;
        }
        .fak-card {
          padding: 14px 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .fak-list,
        .fak-list-inner,
        .tab-content-chevron,
        .fak-btn,
        .tab-content-toggle {
          transition: none;
        }
      }
    </style>
  </head>

    <script>
      const fakultasData = [
        {
          id: "fip",
          nama: "Fakultas Ilmu Pendidikan",
          hero: "https://um.ac.id/wp-content/uploads/2026/07/fip.webp",
          heroAlt: "Fakultas Ilmu Pendidikan",
          tentang: `Fakultas Ilmu Pendidikan merupakan fakultas tertua dan cikal bakal berdirinya Universitas Negeri Malang. Sejarahnya dimulai pada tahun 1954 saat didirikan sebagai Perguruan Tinggi Pendidikan Guru (PTPG) Malang. FIP kemudian menjadi bagian dari Fakultas Keguruan dan Ilmu Pendidikan (FKIP) Universitas Airlangga, lalu menjadi inti dari Institut Keguruan dan Ilmu Pendidikan (IKIP) Malang pada tahun 1963. Sejak tahun 1999, FIP resmi menjadi salah satu fakultas unggulan di Universitas Negeri Malang. Secara kelembagaan, FIP terdiri dari beberapa departemen, yaitu: Departemen Bimbingan dan Konseling (BK), Departemen Teknologi Pendidikan, Departemen Manajemen Pendidikan, Departemen Pendidikan Nonformal, Departemen Kependidikan Sekolah Dasar dan Prasekolah (KSDP), Departemen Pendidikan Luar Biasa, dan Departemen Pendidikan Anak Usia Dini (PAUD).`,
          visi: `Menjadi fakultas unggul dan rujukan bidang kependidikan yang berdaya saing global.`,

          heroAlt: "Sekolah Pascasarjana",
          tentang: `Program Pendidikan Doktor di IKIP Malang (kini Universitas Negeri Malang) dirintis sejak 1968 melalui Program Sarjana Purna bekerja sama dengan Ford Foundation. Pada 1976, program ini berkembang menjadi Program Studi Pendidikan Doktor (PSPD). Perkuliahan doktor pertama dibuka pada 1 Februari 1976 dan terus berkembang ke berbagai bidang. Sejak 1980, program pascasarjana juga mencakup jenjang Magister (S2). Secara kelembagaan, program ini berubah menjadi Program Pascasarjana dan Doktor (1982), Fakultas Pascasarjana (1983), dan sejak 1990 menjadi Program Pascasarjana (PPs).`,
          visi: `Menjadi sekolah pascasarjana dan pendidikan profesi yang unggul serta menjadi rujukan dalam program pendidikan multidisiplin.`,
          misi: [
            `Menyelenggarakan pendidikan berkarakter dan pembelajaran berbasis kehidupan yang mengembangkan kemandirian belajar, kemampuan berpikir kritis dan kreatif dengan menggunakan pendekatan pembelajaran yang efektif, dan mengoptimalkan pemanfaatan teknologi.`,
            `Menyelenggarakan penelitian yang bermanfaat bagi pengembangan ilmu pengetahuan, teknologi, kependidikan multidisiplin, dan kesejahteraan masyarakat.`,
            `Menyelenggarakan pengabdian kepada masyarakat yang berorientasi pada pemberdayaan masyarakat melalui penerapan ilmu pengetahuan, teknologi, dan bidang kependidikan.`,
            `Menyelenggarakan tata pamong yang otonom, akuntabel, dan transparan untuk peningkatan kualitas berkelanjutan.`,
          ],
          karir: `Menghasilkan lulusan yang kompeten secara akademik dan profesional, berakhlak mulia, mandiri, serta memiliki komitmen kebangsaan. Lulusan diharapkan mampu berkembang secara berkelanjutan sesuai tuntutan zaman. Pengabdian kepada masyarakat diarahkan untuk mendukung pendidikan, mencerdaskan kehidupan bangsa, dan meningkatkan kesejahteraan masyarakat.`,
          ctaLink: "https://pasca.um.ac.id/",
          ctaGambar: "https://um.ac.id/wp-content/uploads/2026/07/pasca.webp",
        },
      ];
      // ============================================================
      // RENDER: sidebar & konten dibangun dari fakultasData di atas,
      // dengan interaksi dropdown yang sama seperti tentang_unit.html
      // (tombol toggle + daftar vertikal yang bisa dibuka/tutup di HP).
      // ============================================================
      function renderFakultas() {
        const sidebarList = document.getElementById("fak-sidebar-list");
        const content = document.getElementById("fak-content");

        sidebarList.innerHTML = "";
        content.innerHTML = "";

        fakultasData.forEach((f, idx) => {
          // --- tombol daftar fakultas ---
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "fak-btn" + (idx === 0 ? " active" : "");
          btn.dataset.target = f.id;
          btn.innerHTML = `
            <svg class="icon-dibagian-sidebar-link"><use href="#icon-fak"></use></svg>
            <span>${f.nama}</span>
          `;
          btn.addEventListener("click", () => setActiveFakultas(f.id));
          sidebarList.appendChild(btn);

          // --- daftar misi ---
          const misiHtml = f.misi
            .map(
              (item) => `
                <li>
                  <svg class="li-icon" width="12" height="15"><use href="#icon-fak"></use></svg>
                  ${item}
                </li>`,
            )
            .join("");

          // --- panel konten ---
          const tab = document.createElement("div");
          tab.className = "fak-tab" + (idx === 0 ? " active" : "");
          tab.id = "c-" + f.id;
          tab.innerHTML = `
            <div class="fak-card">
              <div class="fak-page-header">
                <span class="fak-page-header-icon">
                  <svg width="16"
            height="16"><use href="#icon-fak"></use></svg>
                </span>
                <span class="fak-page-header-text">${f.nama}</span>
              </div>

              <div class="fak-hero">
                <img src="${f.hero}" alt="${f.heroAlt || ""}" />
              </div>

              <div class="fak-label y-badge-yellow">Tentang</div>
              <div class="fak-title">Profil Singkat</div>
              <div class="fak-body">${f.tentang}</div>
            </div>

            <div class="fak-card">
              <div class="fak-label y-badge-blue">Arah &amp; Tujuan</div>
              <div class="fak-title">Visi</div>
              <div class="fak-body">${f.visi}</div>
            </div>

            <div class="fak-card">
              <div class="fak-label y-badge-green">Komitmen</div>
              <div class="fak-title">Misi</div>
              <div class="fak-body">
                <ul>${misiHtml}</ul>
              </div>
            </div>

            <div class="fak-card">
              <div class="fak-label y-badge-purple">Masa Depan</div>
              <div class="fak-title">Prospek Karir</div>
              <div class="fak-body">${f.karir}</div>
            </div>

            <div class="card-bawah-item">
              <div class="card-bawah-teks">
                <h3>Pelajari lebih lanjut tentang ${f.nama}</h3>
                <p>
                  Temukan informasi lengkap mengenai program studi, pendaftaran,
                  fasilitas, dan kegiatan akademik.
                </p>
                <a href="${f.ctaLink}" target="_blank" class="cta-fakultas">
                  Lihat Selengkapnya
                  <svg width="13" height="17"><use href="#icon-arrow"></use></svg>
                </a>
              </div>
              <div class="card-bawah-gambar">
                <div class="card-bawah-gambar-placeholder">
                  <img
                    src="${f.ctaGambar}"
                    alt=""
                    onerror="this.style.display='none'; this.parentElement.textContent='Gambar 1';"
                  />
                </div>
              </div>
            </div>
          `;
          content.appendChild(tab);
        });

        // Label tombol dropdown di HP mengikuti nama fakultas yang aktif
        const firstActive = fakultasData[0];
        if (firstActive) {
          document.getElementById("tab-content-toggle-label").textContent =
            firstActive.nama;
        }
      }

      const isMobileView = () =>
        window.matchMedia("(max-width: 768px)").matches;

      function setActiveFakultas(id) {
        document
          .querySelectorAll(".fak-btn")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.target === id),
          );
        document
          .querySelectorAll(".fak-tab")
          .forEach((t) => t.classList.toggle("active", t.id === "c-" + id));

        // Perbarui label tombol dropdown di HP, seperti tampilan "select"
        const item = fakultasData.find((f) => f.id === id);
        const label = document.getElementById("tab-content-toggle-label");
        if (item && label) label.textContent = item.nama;

        // Di HP, tutup dropdown begitu satu fakultas dipilih supaya
        // kontennya langsung terlihat, sama seperti perilaku di tentang_unit.html
        if (isMobileView()) {
          closeFakDropdown();
          const panel = document.getElementById("c-" + id);
          const toggle = document.getElementById("tab-content-toggle");
          if (panel && toggle) {
            const offset = toggle.getBoundingClientRect().bottom + 8;
            const top = panel.getBoundingClientRect().top;
            if (top < offset) {
              window.scrollTo({
                top: window.scrollY + top - offset,
                behavior: window.matchMedia("(prefers-reduced-motion: reduce)")
                  .matches
                  ? "auto"
                  : "smooth",
              });
            }
          }
        }
      }

      // Toggle dropdown fakultas (khusus tampilan HP)
      function openFakDropdown() {
        document.getElementById("fak-list").classList.add("open");
        document.getElementById("tab-content-toggle").classList.add("open");
        document
          .getElementById("tab-content-toggle")
          .setAttribute("aria-expanded", "true");
      }
      function closeFakDropdown() {
        document.getElementById("fak-list").classList.remove("open");
        document.getElementById("tab-content-toggle").classList.remove("open");
        document
          .getElementById("tab-content-toggle")
          .setAttribute("aria-expanded", "false");
      }
      function toggleFakDropdown() {
        const isOpen = document
          .getElementById("fak-list")
          .classList.contains("open");
        if (isOpen) closeFakDropdown();
        else openFakDropdown();
      }

      document
        .getElementById("tab-content-toggle")
        .addEventListener("click", toggleFakDropdown);

      renderFakultas();
    </script>
  </body>
</html>
