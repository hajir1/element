<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy-deep: #0b1a35;
        --navy: #0d2158;
        --gold-soft: #f6cf52;
      }
      .grid {
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 44px;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
          max-width: 420px;
          gap: 32px;
        }
      }

      .item {
        display: flex;
        flex-direction: column;
        transition: all 0.6s ease;
        border-radius: 10px;
      }

      /* -- Ganti bagian ini dengan <img src="..."> milik kamu -- */
      .photo {
        width: 100%;
        aspect-ratio: 4/3;
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        overflow: hidden;
        background: linear-gradient(135deg, #22345f, #16264a);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.35);
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      .photo img {
        width: 100%;
        height: 100%;
        transform: scale(1);
        object-fit: cover;
        display: block;
        overflow: hidden;
        transition: all 0.6s ease;
      }

      .item:hover .photo img {
        transform: scale(1.1);
        transition: all 0.6s ease;
      }
      .body {
        padding: 22px 0;
        display: flex;
        gap: 12px;
        position: relative;
        overflow: hidden;
        align-items: start;
        border-bottom-right-radius: 10px;
        border-bottom-left-radius: 10px;
      }

      .heading {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      /* -- Ganti bagian ini dengan ikon SVG milik kamu -- */
      .icon {
        width: 20px;
        height: 20px;
        margin-left: 8px;
        color: #ffffff;
        flex-shrink: 0;
        transition: all 0.6s ease;
      }

      .bar {
        border: 2px solid white;
        height: 40%;
      }

      .title {
        font-weight: 700;
        font-size: 22px;
        color: #fff;
        margin: 0 12px;
      }

      .address {
        font-size: 14px;
        line-height: 1.65;
        color: #fff;
        font-weight: 400;
        margin: 0 12px;
      }
      .footer-ring-3-kampus {
        position: absolute;
        left: -36px;
        bottom: -36px;
        width: 72px;
        height: 72px;
        opacity: 0;
        border-radius: 50%;
        border: 10px solid #cfd8e3;
        pointer-events: none;
      }
      .item:hover .footer-ring-3-kampus {
        opacity: 0.32;
        transition: all 0.6s ease;
      }
      .bintang-footer-3-kampus-icon {
        position: absolute;
        right: 0px;
        top: 20;
        z-index: 1;
        width: 64px;
        height: 64px;
        color: #ffffff;
        opacity: 0;
        /* transform: scale(0.85); */
        pointer-events: none;
        transition:
          opacity 220ms ease,
          transform 220ms ease;
      }
      .item:hover .bintang-footer-3-kampus-icon {
        opacity: 0.32;
        /* transform: scale(1); */
      }
      .item:hover .body {
        background-color: #1168db;
        transition: all 0.6s ease;
      }
    </style>
