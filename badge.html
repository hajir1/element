<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .y-badge {
        display: inline-block;
        font-size: 16px;
        font-weight: 700;
        text-transform: capitalize;
        padding: 8px 12px;
        border-radius: 999px;
        white-space: nowrap;
        color: #012060;
      }
      .y-badge-green {
        background: #d2edbd;
        border: 1px solid #bcff88;
      }
      .y-badge-red {
        background: #ffd0ca;
        border: 1px solid #ff9f93;
      }
      .y-badge-orange {
        background: #ffc8aa;
        border: 1px solid #e6b296;
      }
      .y-badge-purple {
        background: #e7cff3;
        border: 1px solid #c899e0;
      }
      .y-badge-red {
        background: #f5e9cc;
        border: 1px solid #e8d19a;
      }
      .y-badge-blue {
        background: #bee1f5;
        border: 1px solid #74cdff;
      }
      .y-badge-pink {
        background: #ffdbe9;
        border: 1px solid #f0a8c4;
      }
      .y-badge-yellow {
        background: #fff3b0;
        border: 1px solid #ffe066;
      }
      .y-badge-teal {
        background: #bdf0e6;
        border: 1px solid #7fe0cf;
      }
      .y-badge-indigo {
        background: #d6d9fb;
        border: 1px solid #aeb4f5;
      }
      .y-badge-gray {
        background: #e2e4e8;
        border: 1px solid #c7cad1;
      }
    </style>
  </head>
  <body>
    <div class="y-badge y-badge-green">Green</div>
    <div class="y-badge y-badge-red">Red</div>
    <div class="y-badge y-badge-orange">Orange</div>
    <div class="y-badge y-badge-purple">Purple</div>
    <div class="y-badge y-badge-blue">Blue</div>
    <div class="y-badge y-badge-pink">Pink</div>
    <div class="y-badge y-badge-yellow">Yellow</div>
    <div class="y-badge y-badge-teal">Teal</div>
    <div class="y-badge y-badge-indigo">Indigo</div>
    <div class="y-badge y-badge-gray">Gray</div>
  </body>
</html>
