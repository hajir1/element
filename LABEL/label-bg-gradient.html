<style>
  .label-bg-gradient {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding-right: 12px;
    background: linear-gradient(135deg, #0242c6 0%, #012060 100%);
    border: 1px solid white;
    border-radius: 4px;
    color: #ffffff;
    font-family: "Albert Sans", Helvetica, Arial, Lucida, sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition:
      background 0.2s ease,
      color 0.2s ease,
      border-color 0.2s ease;
  }

  .icon-label {
    background-color: #012060;
    padding: 12px;
    width: 60px;
    height: 60px;
    border-radius: 4px;
  }

  .label-bg-gradient-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .icon-bg-gradient-decor {
    position: absolute;
    right: 0px;
  }

  .label-bg-gradient-decor {
    width: 240px;
    /* height: 240px; */
    pointer-events: none;
    /* animation: um-btn-decor-spin 6s linear infinite; */
  }

  /* ===== Tablet ===== */
  @media (max-width: 1024px) {
    .label-bg-gradient {
      font-size: 22px;
      gap: 10px;
      padding-right: 10px;

    }

    .icon-bg-gradient-decor {
      right: 24px;
    }

  }

  /* ===== HP / Mobile ===== */
  @media (max-width: 600px) {
    .label-bg-gradient-wrapper {
      flex-direction: column;
    }

    .label-bg-gradient {
      font-size: 22px;
      font-weight: 500;
      gap: 20px;
    }

    .icon-label {
      width: 44px;
      padding: 8px;
      height: 44px;
    }
    /* Icon dekoratif dilepas dari posisi absolute,
           ikut alur kolom, ditaruh di atas tombol, dan diperkecil */
    .icon-bg-gradient-decor {
      /* position: static;
      
      order: -1; */
      display: none;
    }

  }
</style>
